name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.py'
      - '**.js'
      - '**.jsx'

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # リポジトリのチェックアウト
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun環境セットアップ
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 依存関係インストール
      - name: Install Dependencies
        run: |
          bun install

      # Claude Code CLI インストール
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "Installed Claude Code version:"
          claude --version

      # Python環境セットアップ（Serena MCP用）
      - name: Setup Python for Serena MCP
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # uv インストール（Serena MCP管理用）
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # PR差分取得
      - name: Get PR Diff
        id: get-diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr-diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TypeScriptレビュースクリプト実行
      - name: Run Review Script
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AI_AGENT_MENTION: ${{ secrets.AI_AGENT_MENTION }}
        run: |
          bun run tools/pr-review/index.ts

      # エラー時のフォールバック
      - name: Fallback Comment on Error
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ 自動レビューでエラーが発生しました。ログを確認してください。"
